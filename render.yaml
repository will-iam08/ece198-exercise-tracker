services:
  - type: web
    name: motiontrack
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node seed-demo.js && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: HOST
        value: 0.0.0.0
      # Passwords for the demo accounts created by seed-demo.js. Render generates
      # a random value for each one that does not exist yet; read them on the
      # service's Environment page. Without them no demo accounts are created.
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_DOCTOR_PASSWORD
        generateValue: true
      - key: DEMO_PATIENT_PASSWORD
        generateValue: true
